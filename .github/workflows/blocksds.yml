name: build-ftpdsi-blocksds
on:
  push:
    branches: [blocksds-port]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container: skylyrac/blocksds:slim-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build ARM9
        run: |
          M=$BLOCKSDS/sys/default_makefiles/rom_arm9arm7
          mkdir -p build
          export SOURCEDIRS=source
          export INCLUDEDIRS=include
          export LIBS="-ldswifi9 -lnds9"
          export DEFINES='-D_NDS -DSTATUS_STRING=\"ftpd-dsi\"'
          export LIBDIRS="$BLOCKSDS/libs/dswifi"
          make -f $M/Makefile.arm9 2>&1 | tail -60
          test -f build/arm9.elf
      - name: Pack NDS
        run: |
          NT=$BLOCKSDS/tools/ndstool/ndstool
          A7=$BLOCKSDS/sys/arm7/main_core/arm7_dswifi.elf
          $NT -c ftpdsi.nds -7 $A7 -9 build/arm9.elf -b meta/icon32.bmp "FTP Server;DS or DSi;hai-nv" -uc 2
          $NT -c ftpdsi_dsi_only.nds -7 $A7 -9 build/arm9.elf -b meta/icon32.bmp "FTP Server;DSi only;hai-nv" -uc 3
          ls -l ftpdsi*.nds
      - uses: actions/upload-artifact@v4
        with:
          name: ftpdsi
          path: ftpdsi*.nds
