name: probe-blocksds
on:
  push:
    branches: [blocksds-port]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    container: skylyrac/blocksds:slim-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect SDK
        run: |
          M=$BLOCKSDS/sys/default_makefiles/rom_arm9arm7
          echo "=====ARM9"; sed -n 1,95p $M/Makefile.arm9
          echo "=====NDSTOOL"; $BLOCKSDS/tools/ndstool/ndstool 2>&1 | grep -iE "unit|dsi|-u |-z|-g " | head -20
