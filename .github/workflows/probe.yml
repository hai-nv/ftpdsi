name: probe-blocksds
on:
  push:
    branches: [blocksds-port]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    container: skylyrac/blocksds:slim-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect SDK
        run: |
          M=$BLOCKSDS/sys/default_makefiles/rom_arm9arm7
          ls -R $M | head -20
          echo ---- ROOT MAKEFILE; cat $M/Makefile | head -150
          echo ---- grep dsi; grep -rniE "dsi|ndstool|-d " $M | head -30
          echo ---- templates; ls $BLOCKSDS/templates 2>/dev/null | head; ls $BLOCKSDS/../ 2>/dev/null | head
